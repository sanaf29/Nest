spring:
  application:
    name: nest
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  error:
    include-stacktrace: never
    include-message: never

nest:
  security:
    bcrypt-strength: 12
    jwt:
      secret: ${NEST_JWT_SECRET:}
      issuer: nest
      access-token-ttl: 60m
  cors:
    allowed-origins: ${NEST_CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

---
# Local development against docker-compose SQL Server.
# Values come from environment variables or from a git-ignored .env file.
spring:
  config:
    activate:
      on-profile: dev
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: jdbc:sqlserver://${NEST_DB_HOST:localhost}:${NEST_DB_PORT:1433};databaseName=${NEST_DB_NAME:nest};encrypt=true;trustServerCertificate=true
    username: ${NEST_DB_USERNAME:sa}
    password: ${NEST_DB_PASSWORD}
